name: docker-openclaw-gpu

on:
  workflow_dispatch:
    inputs:
      openclaw_repo:
        description: "OpenClaw-RL repo URL"
        required: false
        default: "https://github.com/Gen-Verse/OpenClaw-RL.git"
      openclaw_ref:
        description: "OpenClaw-RL git ref (branch / tag / commit)"
        required: false
        default: "main"
      image_tag:
        description: "Docker image tag override"
        required: false
        default: ""
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/*.yml"
      - "docker/**"
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/*.yml"
      - "docker/**"
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cuda
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    env:
      IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_USERNAME }}/openclaw-rl-gpu

    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="latest"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.openclaw_repo }}" ]; then
            OPENCLAW_REPO="${{ github.event.inputs.openclaw_repo }}"
          else
            OPENCLAW_REPO="https://github.com/Gen-Verse/OpenClaw-RL.git"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.openclaw_ref }}" ]; then
            OPENCLAW_REF="${{ github.event.inputs.openclaw_ref }}"
          else
            OPENCLAW_REF="main"
          fi

          SAFE_REF=$(echo "$OPENCLAW_REF" | tr '/:@' '-')

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "openclaw_repo=${OPENCLAW_REPO}" >> "$GITHUB_OUTPUT"
          echo "openclaw_ref=${OPENCLAW_REF}" >> "$GITHUB_OUTPUT"
          echo "safe_ref=${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: Write Dockerfile
        shell: bash
        run: |
          cat > Dockerfile <<'EOF'
          FROM rlsys/slime:latest

          SHELL ["/bin/bash", "-lc"]

          ARG OPENCLAW_REPO
          ARG OPENCLAW_REF=main

          ENV PYTHONUNBUFFERED=1 \
              PIP_NO_CACHE_DIR=1 \
              OPENCLAW_HOME=/opt/OpenClaw-RL \
              PYTHONPATH=/opt/OpenClaw-RL:/opt/OpenClaw-RL/slime:$PYTHONPATH

          WORKDIR /opt

          # upgrade pip toolchain + latest transformers
          RUN python -m pip install --upgrade pip setuptools wheel && \
              pip uninstall -y transformers tokenizers huggingface-hub || true && \
              pip install -U transformers tokenizers huggingface-hub accelerate

          # clone OpenClaw-RL
          RUN git clone "${OPENCLAW_REPO}" OpenClaw-RL && \
              cd OpenClaw-RL && \
              git checkout "${OPENCLAW_REF}"

          WORKDIR /opt/OpenClaw-RL

          # install repo dependencies
          RUN if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          CMD ["/bin/bash"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          build-args: |
            OPENCLAW_REPO=${{ steps.meta.outputs.openclaw_repo }}
            OPENCLAW_REF=${{ steps.meta.outputs.openclaw_ref }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      - name: Smoke test container
        shell: bash
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            python - <<'PY'
          import os
          import transformers
          print("transformers:", transformers.__version__)
          print("openclaw exists:", os.path.exists("/opt/OpenClaw-RL"))
          print("slime path exists:", os.path.exists("/opt/OpenClaw-RL/slime"))
          print("smoke test passed")
          PY

      - name: Push image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            OPENCLAW_REPO=${{ steps.meta.outputs.openclaw_repo }}
            OPENCLAW_REF=${{ steps.meta.outputs.openclaw_ref }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:openclaw-${{ steps.meta.outputs.safe_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
